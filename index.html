<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080711">

  <title>ASTRAVEN STUDIOS | Beyond Legend</title>

  <meta name="description"
    content="Enter the worlds of ASTRAVEN STUDIOS. Discover original comics, legendary heroes and extraordinary adventures.">

  <style>
    :root {
      --background: #080711;
      --surface: #121020;
      --gold: #e8c779;
      --purple: #9b70ff;
      --text: #ffffff;
      --muted: #b8b3ca;
      --border: rgba(232, 199, 121, 0.25);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    .announcement {
      text-align: center;
      padding: 9px 12px;
      background: #171126;
      color: var(--gold);
      font-size: 11px;
      letter-spacing: 2px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 6%;
      border-bottom: 1px solid var(--border);
      background: rgba(8, 7, 17, 0.97);
    }

    .brand {
      font-family: Georgia, serif;
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 2px;
      color: var(--gold);
    }

    .brand small {
      display: block;
      font-family: Arial, sans-serif;
      font-size: 9px;
      letter-spacing: 5px;
      text-align: center;
      color: white;
    }

    nav {
      display: flex;
      gap: 18px;
      font-size: 12px;
      color: var(--muted);
    }

    nav a:hover {
      color: var(--gold);
    }

    .hero {
      position: relative;
      overflow: hidden;
      padding: 85px 7% 75px;
      text-align: center;
      background:
        radial-gradient(ellipse at 50% 10%,
          rgba(115, 56, 205, 0.35), transparent 55%),
        radial-gradient(ellipse at 50% 100%,
          rgba(188, 135, 54, 0.12), transparent 55%),
        #080711;
      border-bottom: 1px solid var(--border);
    }

    .eyebrow {
      color: var(--gold);
      font-size: 11px;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    .hero h1 {
      max-width: 850px;
      margin: 22px auto 12px;
      font-family: Georgia, serif;
      font-size: clamp(37px, 9vw, 76px);
      line-height: 1.08;
      letter-spacing: 2px;
    }

    .hero h1 span {
      color: var(--gold);
    }

    .hero p {
      max-width: 520px;
      margin: 18px auto 30px;
      color: var(--muted);
      font-size: 15px;
    }

    .button {
      display: inline-block;
      padding: 14px 24px;
      border: 1px solid var(--gold);
      border-radius: 4px;
      background: var(--gold);
      color: #15101d;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 1px;
      cursor: pointer;
      transition: 0.2s;
    }

    .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 25px rgba(232, 199, 121, 0.2);
    }

    .button.secondary {
      background: transparent;
      color: var(--gold);
    }

    .section {
      padding: 55px 6%;
    }

    .section-heading {
      margin-bottom: 25px;
    }

    .section-heading span {
      color: var(--purple);
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .section-heading h2 {
      margin: 5px 0;
      font-family: Georgia, serif;
      font-size: 31px;
    }

    .featured {
      display: grid;
      grid-template-columns: 1fr;
      gap: 25px;
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background:
        radial-gradient(ellipse at top right,
          rgba(117, 68, 187, 0.16), transparent 60%),
        var(--surface);
    }

    .comic-art {
      min-height: 270px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 25px;
      border: 1px solid rgba(232, 199, 121, 0.35);
      border-radius: 6px;
      background:
        radial-gradient(circle at center,
          rgba(125, 73, 226, 0.55), transparent 40%),
        linear-gradient(145deg, #21143e, #090812 75%);
    }

    .comic-art .symbol {
      color: var(--gold);
      font-size: 75px;
      line-height: 1.2;
    }

    .comic-art h3 {
      margin: 12px 0 0;
      font-family: Georgia, serif;
      font-size: clamp(22px, 5vw, 35px);
      line-height: 1.2;
      letter-spacing: 2px;
    }

    .comic-art p {
      color: var(--gold);
      font-size: 10px;
      letter-spacing: 3px;
    }

    .featured-info {
      padding: 5px;
    }

    .badge {
      display: inline-block;
      padding: 5px 10px;
      border: 1px solid rgba(155, 112, 255, 0.5);
      border-radius: 3px;
      color: #c6adff;
      font-size: 10px;
      letter-spacing: 1px;
    }

    .featured-info h3 {
      margin: 15px 0 8px;
      font-family: Georgia, serif;
      font-size: 30px;
      line-height: 1.2;
    }

    .featured-info > p {
      color: var(--muted);
      font-size: 14px;
    }

    .chapter-list {
      margin: 20px 0;
    }

    .chapter {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
      padding: 14px;
      border: 1px solid #302942;
      border-radius: 5px;
      background: #0d0b18;
    }

    .chapter strong {
      display: block;
      font-size: 12px;
    }

    .chapter small {
      color: var(--muted);
      font-size: 10px;
    }

    .chapter-status {
      flex-shrink: 0;
      color: #91e7b0;
      font-size: 10px;
      font-weight: bold;
    }

    .chapter-status.locked {
      color: var(--gold);
    }

      padding: 7px 12px;
      border: 1px solid var(--border);
